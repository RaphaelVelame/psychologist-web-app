<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Memória das emoções — recurso interativo</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml" />
    <script src="game.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Memória das emoções ✳</h1>
        <p>Encontre dois cartões com a mesma emoção. Observe as palavras e seus símbolos.</p>
      </header>
      <div class="stats">
        <span id="contador" role="status">Pares: 0 / 6</span
        ><button class="restart" id="reiniciar" type="button">Recomeçar ↻</button>
      </div>
      <div class="grid" id="tabuleiro" aria-label="Jogo de memória com 12 cartas"></div>
      <div class="message" id="mensagem" role="status" aria-live="polite">
        Vire duas cartas para encontrar um par.
      </div>
      <small>Jogo lúdico demonstrativo. Não é um teste ou avaliação psicológica.</small>
    </main>
  </body>
</html>
